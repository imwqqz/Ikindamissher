[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikindamissher"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
    "torch==2.14.0",
    "transformers>=5.20.2",
    "trl>=1.16.0",
]

[project.scripts]
her-train = "her:main"
her-chat = "client.repl:main"
her-export-sft = "tools.export_sft:main"
her-service = "server.service:main"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"src/tokenizer.py" = "tokenizer.py"
"src/data.py" = "data.py"
"src/config.py" = "config.py"
"src/engines/dispatch.py" = "engines/dispatch.py"
"src/engines/qwen/qwen_lm.py" = "engines/qwen/qwen_lm.py"
"src/engines/legacy/model.py" = "engines/legacy/model.py"
"src/engines/legacy/training.py" = "engines/legacy/training.py"
"src/engines/legacy/checkpoint.py" = "engines/legacy/checkpoint.py"
"her.py" = "her.py"
"client/repl.py" = "client/repl.py"
"server/service.py" = "server/service.py"
"tools/export_sft.py" = "tools/export_sft.py"
"tools/eval_qwen.py" = "tools/eval_qwen.py"
"tools/checks.py" = "tools/checks.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/her.py", "/client", "/server", "/tools", "/configs", "/README.md"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
