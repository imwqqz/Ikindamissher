[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikindamissher"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "torch==2.14.0",
    "transformers>=5.20.2",
    "trl>=1.16.0",
]

# The project is never pip-installed (all entrypoints run via uv run python).
# Disabling packaging keeps the venv free of stale shadow copies of src/ modules.
[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
